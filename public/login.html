<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20231f"><title>ورود و ثبت‌نام | FXI BotForge</title><link rel="stylesheet" href="/styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>.auth-wrap{max-width:480px;margin:75px auto;padding:0 20px}.auth-card{background:#fffefa;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 18px 60px #2428200b}.auth-card h1{font-size:30px;letter-spacing:-1px;margin:10px 0}.auth-card p{color:var(--muted);font-size:12px;line-height:2}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:12px;font-weight:600}.field input{font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:#f8f7f1;outline:none}.field input:focus{border-color:var(--olive)}.auth-card .button{border:0;cursor:pointer;font:inherit;width:100%;justify-content:center;margin-top:10px}.switch{display:flex;justify-content:center;gap:7px;margin-top:20px;font-size:12px}.switch button{border:0;background:none;color:var(--olive);font:inherit;cursor:pointer}.notice{font-size:12px;padding:10px;border-radius:8px;background:#eceee4;color:#4d5a3e;display:none}.notice.error{background:#f6e9e4;color:#9b4934}.brand-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a><a class="text-link" href="/">بازگشت به خانه</a></header><main class="auth-wrap"><div class="auth-card"><div class="eyebrow">حساب کاربری BotForge</div><h1 id="heading">خوش برگشتی.</h1><p id="subheading">وارد حساب شو تا سورس‌ها و درخواست‌هایت را مدیریت کنی.</p><div id="notice" class="notice" role="status"></div><form id="auth-form"><div class="field"><label for="email">ایمیل</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" minlength="10" required maxlength="200"></div><button class="button" id="submit" type="submit">ورود به حساب ←</button></form><div class="switch"><span id="switch-label">حساب نداری؟</span><button id="switch" type="button">ثبت‌نام کن</button></div></div></main><script>
let registerMode=false;const form=document.querySelector("#auth-form"),notice=document.querySelector("#notice");document.querySelector("#switch").onclick=()=>{registerMode=!registerMode;document.querySelector("#heading").textContent=registerMode?"حساب تازه بساز.":"خوش برگشتی.";document.querySelector("#subheading").textContent=registerMode?"برای ارسال و پیگیری سورس‌ها ثبت‌نام کن.":"وارد حساب شو تا سورس‌ها و درخواست‌هایت را مدیریت کنی.";document.querySelector("#submit").textContent=registerMode?"ساخت حساب ←":"ورود به حساب ←";document.querySelector("#switch-label").textContent=registerMode?"قبلاً حساب داری؟":"حساب نداری؟";document.querySelector("#switch").textContent=registerMode?"وارد شو":"ثبت‌نام کن";document.querySelector("#password").autocomplete=registerMode?"new-password":"current-password";notice.style.display="none"};
form.onsubmit=async e=>{e.preventDefault();notice.style.display="none";const button=document.querySelector("#submit");button.disabled=true;try{const res=await fetch(registerMode?"/api/auth/register":"/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.querySelector("#email").value,password:document.querySelector("#password").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"درخواست ناموفق بود.");if(registerMode){notice.textContent="حساب ساخته شد. حالا وارد شو.";notice.className="notice";notice.style.display="block";document.querySelector("#switch").click()}else location.href="/dashboard.html"}catch(err){notice.textContent=err.message;notice.className="notice error";notice.style.display="block"}finally{button.disabled=false}};
fetch("/api/me").then(r=>{if(r.ok)location.href="/dashboard.html"}).catch(()=>{});
</script></body></html>
