<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17231d">
  <title>ورود و ثبت‌نام | FXI BotForge</title>
  <link rel="stylesheet" href="/styles.css?v=botforge-auth-20261124">
</head>
<body class="page-auth">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a>
    <a class="text-link" href="/">بازگشت به کتابخانه ↗</a>
  </header>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="eyebrow"><span class="pulse"></span> فضای اعضای BotForge</div>
      <h1 id="heading">خوش برگشتی.</h1>
      <p id="subheading">وارد حساب شو تا پروژه‌ها و درخواست‌هایت را در یک جا مدیریت کنی.</p>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <form id="auth-form" novalidate>
        <div class="field" id="user-id-field">
          <label for="user-id">شناسه کاربری</label>
          <input id="user-id" type="text" inputmode="numeric" autocomplete="off" placeholder="شناسه ۴ رقمی حساب" maxlength="4" pattern="[0-9]{4}">
        </div>
        <div class="field">
          <label for="username">نام کاربری</label>
          <input id="username" type="text" autocomplete="username" placeholder="مثلاً fxi_user" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+">
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="حداقل ۱۰ کاراکتر" minlength="10" required maxlength="200">
        </div>
        <button class="button" id="submit" type="submit">ورود به حساب <span>←</span></button>
      </form>
      <div class="switch"><span id="switch-label">حساب کاربری نداری؟</span><button id="switch" type="button">ثبت‌نام کن</button></div>
    </div>
  </main>
<script>
(() => {
  const $ = (selector) => document.querySelector(selector);
  const form = $("#auth-form");
  const notice = $("#notice");
  const button = $("#submit");
  const username = $("#username");
  const userId = $("#user-id");
  const password = $("#password");
  let registerMode = false;
  let busy = false;

  function showNotice(message, type = "success") {
    notice.textContent = message;
    notice.className = type === "error" ? "notice error" : "notice";
    notice.hidden = false;
    notice.style.display = "block";
  }
  function clearNotice() {
    notice.hidden = true;
    notice.style.display = "none";
    notice.textContent = "";
  }
  async function diagnoseConnection() {
    try {
      const response = await fetch("/api/health", { credentials: "same-origin", cache: "no-store" });
      const health = await response.json().catch(() => ({}));
      if (response.ok && health.database === "connected") return "سرور BotForge و پایگاه داده متصل‌اند؛ درخواست ورود کامل نشد. صفحه را تازه‌سازی کن و دوباره تلاش کن.";
      if (health.database === "unavailable") return "Worker در دسترس است، اما اتصال پایگاه داده D1 برقرار نیست. تنظیمات اتصال DB در Cloudflare باید بررسی شود.";
      return health.error || "سرور پاسخ داد، اما وضعیت سرویس سالم نیست. چند لحظه بعد دوباره تلاش کن.";
    } catch {
      return "مرورگر به Worker سایت دسترسی پیدا نکرد. آدرس سایت و اتصال اینترنت را بررسی کن؛ اگر صفحه باز می‌شود ولی این پیام می‌آید، درخواست API در شبکه یا Cloudflare قطع شده است.";
    }
  }
  function setMode(nextMode) {
    registerMode = nextMode;
    $("#heading").textContent = registerMode ? "حساب تازه بساز." : "خوش برگشتی.";
    $("#subheading").textContent = registerMode
      ? "برای ارسال و پیگیری پروژه‌هایت ثبت‌نام کن."
      : "وارد حساب شو تا پروژه‌ها و درخواست‌هایت را مدیریت کنی.";
    button.innerHTML = registerMode ? "ساخت حساب <span>←</span>" : "ورود به حساب <span>←</span>";
    $("#switch-label").textContent = registerMode ? "قبلاً حساب داری؟" : "حساب کاربری نداری؟";
    $("#switch").textContent = registerMode ? "وارد شو" : "ثبت‌نام کن";
    password.autocomplete = registerMode ? "new-password" : "current-password";
    $("#user-id-field").hidden = registerMode;
    userId.required = !registerMode;
    password.placeholder = registerMode ? "حداقل ۱۰ کاراکتر" : "رمز عبور حساب";
    clearNotice();
  }
  $("#switch").addEventListener("click", () => setMode(!registerMode));
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;
    clearNotice();
    const normalizedUsername = username.value.trim().toLowerCase();
    if (!/^[a-z0-9_]{3,24}$/.test(normalizedUsername)) {
      showNotice("نام کاربری باید ۳ تا ۲۴ کاراکتر و شامل حروف انگلیسی، عدد یا _ باشد.", "error");
      username.focus();
      return;
    }
    if (!registerMode && !/^[0-9a-f-]{36}$/i.test(userId.value.trim())) {
      showNotice("شناسه کاربری باید دقیقاً ۴ رقم باشد.", "error");
      userId.focus();
      return;
    }
    if (password.value.length < 10 || password.value.length > 200) {
      showNotice("رمز عبور باید حداقل ۱۰ و حداکثر ۲۰۰ کاراکتر باشد.", "error");
      password.focus();
      return;
    }
    busy = true;
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    button.textContent = registerMode ? "در حال ساخت حساب…" : "در حال بررسی اطلاعات…";
    try {
      const endpoint = registerMode ? "/api/auth/register" : "/api/auth/login";
      const requestOptions = {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store",
        redirect: "error",
        headers: { "content-type": "application/json", "accept": "application/json" },
        body: JSON.stringify(registerMode ? { username: normalizedUsername, password: password.value } : { user_id: userId.value.trim(), username: normalizedUsername, password: password.value })
      };
      let response;
      try {
        response = await fetch(endpoint, requestOptions);
      } catch (firstError) {
        // Retry once for a transient connection interruption.
        await new Promise(resolve => setTimeout(resolve, 500));
        response = await fetch(endpoint, requestOptions);
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `درخواست ناموفق بود (کد ${response.status}).`);
      if (registerMode) {
        setMode(false);
        username.value = normalizedUsername;
        password.value = "";
        userId.value = data.user_id || "";
        showNotice("حساب ساخته شد. شناسه کاربری: " + (data.user_id || "—") + " — این شناسه را همراه نام کاربری و رمز عبورت برای ورود نگه دار.", "success");
        password.focus();
      } else {
        location.replace("/dashboard.html");
      }
    } catch (error) {
      showNotice(error instanceof TypeError ? await diagnoseConnection() : error.message, "error");
    } finally {
      busy = false;
      button.disabled = false;
      button.removeAttribute("aria-busy");
      button.innerHTML = registerMode ? "ساخت حساب <span>←</span>" : "ورود به حساب <span>←</span>";
    }
  });

  fetch("/api/me", { credentials: "same-origin", cache: "no-store" })
    .then((response) => { if (response.ok) location.replace("/dashboard.html"); })
    .catch(() => {});
})();
</script>
</body>
</html>
