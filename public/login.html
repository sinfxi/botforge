<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17231d"><title>ورود و ثبت‌نام | FXI BotForge</title><link rel="stylesheet" href="/styles.css?v=botforge-motion-20261124"></head><body class="page-auth"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a><a class="text-link" href="/">بازگشت به کتابخانه ↗</a></header><main class="auth-wrap"><div class="auth-card"><div class="eyebrow"><span class="pulse"></span> فضای اعضای BotForge</div><h1 id="heading">خوش برگشتی.</h1><p id="subheading">وارد حساب شو تا پروژه‌ها و درخواست‌هایت را در یک جا مدیریت کنی.</p><div id="notice" class="notice" role="status"></div><form id="auth-form"><div class="field"><label for="email">آدرس ایمیل</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required maxlength="254"></div><div class="field"><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="حداقل ۱۰ کاراکتر" minlength="10" required maxlength="200"></div><button class="button" id="submit" type="submit">ورود به حساب <span>←</span></button></form><div class="switch"><span id="switch-label">حساب کاربری نداری؟</span><button id="switch" type="button">ثبت‌نام کن</button></div></div></main><script>
let registerMode=false;const form=document.querySelector("#auth-form"),notice=document.querySelector("#notice");document.querySelector("#switch").onclick=()=>{registerMode=!registerMode;document.querySelector("#heading").textContent=registerMode?"حساب تازه بساز.":"خوش برگشتی.";document.querySelector("#subheading").textContent=registerMode?"برای ارسال و پیگیری پروژه‌هایت ثبت‌نام کن.":"وارد حساب شو تا پروژه‌ها و درخواست‌هایت را مدیریت کنی.";document.querySelector("#submit").textContent=registerMode?"ساخت حساب ←":"ورود به حساب ←";document.querySelector("#switch-label").textContent=registerMode?"قبلاً حساب داری؟":"حساب کاربری نداری؟";document.querySelector("#switch").textContent=registerMode?"وارد شو":"ثبت‌نام کن";document.querySelector("#password").autocomplete=registerMode?"new-password":"current-password";notice.style.display="none"};
form.onsubmit=async e=>{e.preventDefault();notice.style.display="none";const button=document.querySelector("#submit");button.disabled=true;try{const res=await fetch(registerMode?"/api/auth/register":"/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.querySelector("#email").value,password:document.querySelector("#password").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"درخواست ناموفق بود.");if(registerMode){notice.textContent="حساب ساخته شد. حالا وارد شو.";notice.className="notice";notice.style.display="block";document.querySelector("#switch").click()}else location.href="/dashboard.html"}catch(err){notice.textContent=err.message;notice.className="notice error";notice.style.display="block"}finally{button.disabled=false}};
fetch("/api/me").then(r=>{if(r.ok)location.href="/dashboard.html"}).catch(()=>{});
</script></body></html>
