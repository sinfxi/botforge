<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17231d">
  <title>ورود و ثبت‌نام | FXI BotForge</title>
  <link rel="stylesheet" href="/styles.css?v=botforge-auth-fix-20261124">
</head>
<body class="page-auth">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a>
    <a class="text-link" href="/">بازگشت به کتابخانه ↗</a>
  </header>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="eyebrow"><span class="pulse"></span> فضای اعضای BotForge</div>
      <h1 id="heading">خوش برگشتی.</h1>
      <p id="subheading">وارد حساب شو تا پروژه‌ها و درخواست‌هایت را در یک جا مدیریت کنی.</p>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">آدرس ایمیل</label>
          <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required maxlength="254">
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="حداقل ۱۰ کاراکتر" minlength="10" required maxlength="200">
        </div>
        <button class="button" id="submit" type="submit">ورود به حساب <span>←</span></button>
      </form>
      <div class="switch"><span id="switch-label">حساب کاربری نداری؟</span><button id="switch" type="button">ثبت‌نام کن</button></div>
    </div>
  </main>
<script>
(() => {
  const $ = (selector) => document.querySelector(selector);
  const form = $("#auth-form");
  const notice = $("#notice");
  const button = $("#submit");
  const email = $("#email");
  const password = $("#password");
  let registerMode = false;
  let busy = false;

  function showNotice(message, type = "success") {
    notice.textContent = message;
    notice.className = type === "error" ? "notice error" : "notice";
    notice.hidden = false;
    notice.style.display = "block";
  }
  function clearNotice() {
    notice.hidden = true;
    notice.style.display = "none";
    notice.textContent = "";
  }
  function setMode(nextMode) {
    registerMode = nextMode;
    $("#heading").textContent = registerMode ? "حساب تازه بساز." : "خوش برگشتی.";
    $("#subheading").textContent = registerMode
      ? "برای ارسال و پیگیری پروژه‌هایت ثبت‌نام کن."
      : "وارد حساب شو تا پروژه‌ها و درخواست‌هایت را مدیریت کنی.";
    button.innerHTML = registerMode ? "ساخت حساب <span>←</span>" : "ورود به حساب <span>←</span>";
    $("#switch-label").textContent = registerMode ? "قبلاً حساب داری؟" : "حساب کاربری نداری؟";
    $("#switch").textContent = registerMode ? "وارد شو" : "ثبت‌نام کن";
    password.autocomplete = registerMode ? "new-password" : "current-password";
    password.placeholder = registerMode ? "حداقل ۱۰ کاراکتر" : "رمز عبور حساب";
    clearNotice();
  }
  $("#switch").addEventListener("click", () => setMode(!registerMode));
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;
    clearNotice();
    const normalizedEmail = email.value.trim().toLowerCase();
    if (!email.validity.valid || !normalizedEmail) {
      showNotice("یک آدرس ایمیل معتبر وارد کن.", "error");
      email.focus();
      return;
    }
    if (password.value.length < 10 || password.value.length > 200) {
      showNotice("رمز عبور باید حداقل ۱۰ و حداکثر ۲۰۰ کاراکتر باشد.", "error");
      password.focus();
      return;
    }
    busy = true;
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    button.textContent = registerMode ? "در حال ساخت حساب…" : "در حال بررسی اطلاعات…";
    try {
      const response = await fetch(registerMode ? "/api/auth/register" : "/api/auth/login", {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store",
        headers: { "content-type": "application/json", "accept": "application/json" },
        body: JSON.stringify({ email: normalizedEmail, password: password.value })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `درخواست ناموفق بود (کد ${response.status}).`);
      if (registerMode) {
        setMode(false);
        email.value = normalizedEmail;
        password.value = "";
        showNotice("حساب با موفقیت ساخته شد؛ حالا با همین ایمیل وارد شو.", "success");
        password.focus();
      } else {
        location.replace("/dashboard.html");
      }
    } catch (error) {
      showNotice(error instanceof TypeError
        ? "ارتباط با سرور برقرار نشد. اتصال اینترنت را بررسی کن و دوباره تلاش کن."
        : error.message, "error");
    } finally {
      busy = false;
      button.disabled = false;
      button.removeAttribute("aria-busy");
      button.innerHTML = registerMode ? "ساخت حساب <span>←</span>" : "ورود به حساب <span>←</span>";
    }
  });

  fetch("/api/me", { credentials: "same-origin", cache: "no-store" })
    .then((response) => { if (response.ok) location.replace("/dashboard.html"); })
    .catch(() => {});
})();
</script>
</body>
</html>
