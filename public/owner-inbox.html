<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صندوق پیام مالک | FXI</title><link rel="stylesheet" href="/styles.css?v=fxi-original-look-20261126-r17">  <link rel="icon" type="image/webp" href="/assets/cyrus-hero.webp">
</head><body class="page-community"><header class="topbar workspace-topbar"><a class="brand" href="/">FXI <b>BotForge</b></a><nav><a href="/admin.html">پنل مدیریت</a><a href="/community.html">جامعه</a></nav></header><main class="workspace community-wrap"><section class="workspace-hero"><div class="workspace-hero-copy"><div class="eyebrow">OWNER PRIVATE DESK</div><h1>صندوق گفت‌وگوی جامعه</h1><p>پیام‌های خصوصی کاربران و درخواست‌های F COIN را مدیریت کن.</p></div></section><div id="inbox-message" class="workspace-message">در حال بررسی دسترسی…</div><section class="community-grid owner-inbox-grid"><article class="panel community-panel"><h2>گفت‌وگوها</h2><div id="threads" class="inbox-threads"></div></article><article class="panel community-panel"><h2 id="thread-title">یک گفت‌وگو را انتخاب کن</h2><div id="thread-messages" class="owner-chat-messages"></div><form id="reply-form" class="owner-chat-form"><textarea id="reply-text" rows="2" maxlength="2000" placeholder="پاسخ مالک…" required></textarea><button class="button" disabled>ارسال پاسخ</button></form></article></section><section class="panel community-panel"><h2>سفارش‌های فروشگاه F COIN</h2><div id="purchase-list"></div></section></main><script>(()=>{const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fa=n=>Number(n||0).toLocaleString("fa-IR");let selected=null;async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",cache:"no-store",...o,headers:{"content-type":"application/json",...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"خطا");return d}function note(t){$("#inbox-message").textContent=t}async function threads(){const d=await api("/api/admin/owner-chat");$("#threads").innerHTML=(d.items||[]).map(x=>'<button class="inbox-thread '+(selected===x.user_id?"active":"")+'" data-id="'+esc(x.user_id)+'"><b>@'+esc(x.username||"user")+' · '+esc(x.public_id)+'</b><small>'+esc(x.last_body||"")+'</small><span>'+(x.unread?fa(x.unread)+" پیام جدید":"")+'</span></button>').join("")||"پیامی وجود ندارد."}async function openThread(uid){selected=uid;const [d,t]=await Promise.all([api("/api/admin/owner-chat/"+encodeURIComponent(uid)),api("/api/admin/owner-chat")]);const x=(t.items||[]).find(x=>x.user_id===uid);$("#thread-title").textContent=x?"گفت‌وگو با @"+x.username:"گفت‌وگو";$("#thread-messages").innerHTML=(d.items||[]).map(m=>'<div class="chat-bubble '+(m.sender_role==="owner"?"from-owner":"from-user")+'"><small>'+(m.sender_role==="owner"?"مالک":"کاربر")+'</small><p>'+esc(m.body)+'</p><time>'+new Date(m.created_at).toLocaleString("fa-IR")+'</time></div>').join("");$("#reply-form button").disabled=false;await threads()}$("#threads").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)openThread(b.dataset.id).catch(x=>note(x.message))});$("#reply-form").addEventListener("submit",async e=>{e.preventDefault();if(!selected)return;const b=e.submitter;b.disabled=true;try{await api("/api/admin/owner-chat/"+selected,{method:"POST",body:JSON.stringify({message:$("#reply-text").value})});$("#reply-text").value="";await openThread(selected);note("پاسخ ارسال شد.")}catch(x){note(x.message)}finally{b.disabled=false}});async function purchases(){const d=await api("/api/admin/ncoin/purchases");$("#purchase-list").innerHTML=(d.items||[]).map(p=>'<div class="coin-row"><span><b>'+esc(p.title)+'</b><small>@'+esc(p.username)+' · '+esc(p.public_id)+' · '+fa(p.price)+' F COIN</small></span><span>'+esc(p.status)+'</span><span>'+(p.status==="pending"?'<button class="quiet-button" data-p="'+esc(p.id)+'" data-a="approve">تأیید</button> <button class="quiet-button" data-p="'+esc(p.id)+'" data-a="reject">رد و بازگشت سکه</button>':p.status==="approved"?'<button class="quiet-button" data-p="'+esc(p.id)+'" data-a="deliver">ثبت تحویل</button>':"")+'</span></div>').join("")||"سفارشی وجود ندارد."}$("#purchase-list").addEventListener("click",async e=>{const b=e.target.closest("[data-p]");if(!b)return;b.disabled=true;try{await api("/api/admin/ncoin/purchases/"+b.dataset.p+"/"+b.dataset.a,{method:"POST",body:"{}"});await purchases();note("سفارش به‌روزرسانی شد.")}catch(x){note(x.message);b.disabled=false}});api("/api/me").then(d=>{if(d.user?.role!=="owner")throw Error("فقط مالک اصلی دسترسی دارد.");return Promise.all([threads(),purchases()])}).then(()=>note("صندوق پیام آماده است.")).catch(e=>{note(e.message);setTimeout(()=>location.href="/admin.html",1800)});setInterval(()=>{if(!document.hidden){threads().catch(()=>{});purchases().catch(()=>{});if(selected)openThread(selected).catch(()=>{})}},15000)})();</script></body></html>
