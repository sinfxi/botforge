<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17231d"><meta name="robots" content="noindex,nofollow"><title>راه‌اندازی مالک | FXI BotForge</title><link rel="stylesheet" href="/styles.css?v=botforge-auth-20261124"></head><body class="page-setup"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a><a href="/" class="text-link">بازگشت به کتابخانه ↗</a></header><main class="setup"><section class="card"><div class="eyebrow"><span class="pulse"></span> راه‌اندازی اولیه</div><h1>ساخت حساب مالک</h1><p>شناسه و رمز دلخواهت را وارد کن. اولین نفری که این فرم را با موفقیت ثبت کند، مالک اصلی BotForge می‌شود. شناسه را برای ورود نگه دار.</p><form id="setup"><div class="field"><label for="user_id">شناسه کاربری مالک (۴ رقم دلخواه)</label><input id="user_id" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۴۸۲۱" required minlength="4" maxlength="4" pattern="[0-9]{4}"></div><div class="field"><label for="password">رمز عبور مالک</label><input id="password" type="password" autocomplete="new-password" placeholder="رمز دلخواه خودت" required maxlength="200"></div><button class="button" type="submit">ایجاد حساب مالک <span>←</span></button></form><div id="msg" class="msg" role="status"></div><p><a href="/login.html">رفتن به صفحه ورود</a></p></section></main><script>
document.querySelector("#setup").onsubmit=async e=>{e.preventDefault();const b=e.submitter,m=document.querySelector("#msg");b.disabled=true;m.style.display="block";m.textContent="در حال ایجاد حساب…";try{const r=await fetch("/api/auth/bootstrap",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({user_id:document.querySelector("#user_id").value.trim(),password:document.querySelector("#password").value})});const d=await r.json();if(!r.ok){const detail=[d.request_id?"شناسه پیگیری: "+d.request_id:"",d.diagnostic?"جزئیات فنی: "+d.diagnostic:""].filter(Boolean).join(" | ");throw new Error([d.error||"راه‌اندازی ناموفق بود.",detail].filter(Boolean).join("\n"));}m.textContent="حساب مالک ساخته شد. شناسه: "+(d.user_id||"—")+" — با همین شناسه و رمز وارد شو.";e.currentTarget.reset();setTimeout(()=>location.assign("/login.html"),1800)}catch(err){m.style.whiteSpace="pre-wrap";m.textContent=err.message}finally{b.disabled=false}};
</script></body></html>
