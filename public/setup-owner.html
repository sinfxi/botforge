<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17231d"><meta name="robots" content="noindex,nofollow"><title>راه‌اندازی مالک | FXI BotForge</title><link rel="stylesheet" href="/styles.css?v=fxi-performance-20261125-r4">  <link rel="icon" type="image/webp" href="/assets/cyrus-hero.webp">
</head><body class="page-setup"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/cyrus-hero.webp?v=fxi-polish-20261125-r2" alt="" width="46" height="46" decoding="async"></span><span>FXI <b>BotForge</b></span></a><a href="/" class="text-link">بازگشت به کتابخانه ↗</a></header><main class="setup"><section class="card"><div class="eyebrow"><span class="pulse"></span> راه‌اندازی اولیه</div><h1>ساخت حساب مالک</h1><p>شناسه و رمز دلخواهت را وارد کن. اولین نفری که این فرم را با موفقیت ثبت کند، مالک اصلی BotForge می‌شود. شناسه را برای ورود نگه دار.</p><form id="setup"><div class="field"><label for="user_id">شناسه کاربری مالک (۴ رقم دلخواه)</label><input id="user_id" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً 4821" required minlength="4" maxlength="4" pattern="[0-9]{4}"></div><div class="field"><label for="username">نام کاربری مالک</label><input id="username" type="text" autocomplete="username" placeholder="مثلاً admin_fxi" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+"></div><div class="field"><label for="password">رمز عبور مالک</label><input id="password" type="password" autocomplete="new-password" placeholder="حداقل ۱۰ کاراکتر" required minlength="10" maxlength="200"></div><button class="button" type="submit">ایجاد حساب مالک <span>←</span></button></form><div id="msg" class="msg" role="status"></div><p><a href="/login.html">رفتن به صفحه ورود</a></p></section></main><script>
const ownerIdInput=document.querySelector("#user_id");ownerIdInput.addEventListener("input",()=>{ownerIdInput.value=ownerIdInput.value.replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))).replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d))).slice(0,4)});
document.querySelector("#setup").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const b=e.submitter,m=document.querySelector("#msg");b.disabled=true;m.style.display="block";m.textContent="در حال ایجاد حساب…";try{const r=await fetch("/api/auth/bootstrap",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({user_id:document.querySelector("#user_id").value.trim(),username:document.querySelector("#username").value.trim().toLowerCase(),password:document.querySelector("#password").value})});const d=await r.json();if(!r.ok){const detail=[d.request_id?"شناسه پیگیری: "+d.request_id:"",d.diagnostic?"جزئیات فنی: "+d.diagnostic:""].filter(Boolean).join(" | ");throw new Error([d.error||"راه‌اندازی ناموفق بود.",detail].filter(Boolean).join("\n"));}m.textContent="حساب مالک ساخته شد. شناسه: "+(d.user_id||"—")+" | نام کاربری: "+(d.username||"—")+" — هر سه مورد را برای ورود نگه دار.";form.reset();setTimeout(()=>location.assign("/login.html"),1800)}catch(err){m.style.whiteSpace="pre-wrap";m.textContent=err.message}finally{b.disabled=false}};
(async()=>{try{const r=await fetch("/api/auth/bootstrap/status",{cache:"no-store"});const d=await r.json();if(r.ok&&!d.available){const form=document.querySelector("#setup");form.hidden=true;const m=document.querySelector("#msg");m.style.display="block";m.textContent="حساب مالک قبلاً ساخته شده است. راه‌اندازی اولیه بسته شده؛ از صفحه ورود استفاده کن.";}}catch{}})();
</script></body></html>
