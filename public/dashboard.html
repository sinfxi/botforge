<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17231d"><title>حساب من | FXI BotForge</title><link rel="stylesheet" href="/styles.css?v=botforge-pro-20261124"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a><div><a class="text-link" href="/admin.html" id="admin-link" hidden>پنل مدیریت</a> <button id="logout" class="text-link" style="border:0;background:none;font:inherit;cursor:pointer;margin-right:18px">خروج از حساب ↗</button></div></header><main class="dash"><div class="eyebrow"><span class="pulse"></span> فضای شخصی توسعه‌دهنده</div><div class="dash-head"><div><h1>سلام، <span id="email">...</span></h1><p class="muted">از اینجا پروژه جدید بفرست و روند بررسی و اعلان‌هایت را دنبال کن.</p></div></div><div class="dash-grid"><section class="panel"><h2>＋ ارسال پروژه جدید</h2><p class="muted">اطلاعات پروژه را کامل کن تا برای بررسی ارسال شود.</p><form id="submit-form"><div class="field"><label for="title">نام پروژه</label><input id="title" name="title" minlength="3" maxlength="100" placeholder="مثلاً ربات مدیریت گروه" required></div><div class="field"><label for="category">دسته‌بندی پروژه</label><select id="category" name="category" required><option value="">انتخاب دسته‌بندی</option><option>مدیریت گروه</option><option>ابزار کاربردی</option><option>هوش مصنوعی</option><option>سرگرمی</option><option>فروشگاهی</option><option>سایر</option></select></div><div class="field"><label for="description">معرفی و قابلیت‌ها</label><textarea id="description" name="description" minlength="10" maxlength="2000" placeholder="این پروژه چه کاری انجام می‌دهد؟" required></textarea></div><div class="field"><label for="file">فایل ZIP سورس (حداکثر ۵ مگابایت)</label><input id="file" name="file" type="file" accept=".zip,application/zip" required></div><label class="check"><input type="checkbox" name="rights" required> تأیید می‌کنم حق قانونی انتشار این سورس را دارم و محتوای ارسالی ناقض حقوق دیگران نیست.</label><button class="button" type="submit" style="margin-top:18px">ارسال برای بررسی <span>←</span></button><div id="message" role="status"></div></form></section><section class="panel"><h2>درخواست‌های من</h2><div id="submissions" class="muted">در حال بارگذاری…</div></section><section class="panel span2"><h2>اعلان‌ها و به‌روزرسانی‌ها</h2><div id="notifications" class="muted">در حال بارگذاری…</div></section></div></main><script>
const $=s=>document.querySelector(s);async function api(url,options={}){const r=await fetch(url,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"خطا در دریافت اطلاعات");return d}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function init(){try{const me=await api("/api/me");$("#email").textContent=me.user.email;if(["admin","owner"].includes(me.user.role))$("#admin-link").hidden=false;const [subs,notes]=await Promise.all([api("/api/my/submissions"),api("/api/notifications")]);$("#submissions").innerHTML=subs.items.length?subs.items.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.category)+' · '+new Date(x.created_at).toLocaleDateString("fa-IR")+'</div><div class="status">'+({pending:"در انتظار بررسی",approved:"تأیید و منتشر شد",rejected:"رد شد"}[x.status]||esc(x.status))+'</div>'+(x.review_note?'<div>'+esc(x.review_note)+'</div>':'')+'</div>').join(""):"هنوز درخواستی ثبت نکرده‌ای.";$("#notifications").innerHTML=notes.items.length?notes.items.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><p>'+esc(n.body)+'</p><small class="muted">'+new Date(n.created_at).toLocaleString("fa-IR")+'</small></div>').join(""):"اعلانی نداری."}catch(e){location.href="/login.html"}}
$("#submit-form").onsubmit=async e=>{e.preventDefault();const msg=$("#message"),btn=e.submitter;btn.disabled=true;msg.textContent="در حال ارسال…";try{const fd=new FormData(e.currentTarget);const result=await api("/api/submissions",{method:"POST",body:fd});msg.textContent=result.message;e.currentTarget.reset();await init()}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};
$("#logout").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="/"};init();
</script></body></html>
