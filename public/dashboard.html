<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب من | FXI BotForge</title><link rel="stylesheet" href="/styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>.dash{max-width:1100px;margin:55px auto;padding:0 22px}.dash-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.dash h1{font-size:36px;letter-spacing:-1px;margin:8px 0}.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.panel{background:#fffefa;border:1px solid var(--line);border-radius:14px;padding:24px}.panel h2{font-size:18px;margin:0 0 16px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:600}.field input,.field textarea,.field select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:#f8f7f1;width:100%}.field textarea{min-height:110px;resize:vertical}.check{display:flex;align-items:flex-start;gap:9px;font-size:11px;color:var(--muted);line-height:1.8}.panel .button{border:0;cursor:pointer;font:inherit}.item{padding:14px 0;border-bottom:1px solid var(--line);font-size:12px}.item:last-child{border:0}.status{color:var(--olive);font-weight:700}.muted{color:var(--muted)}#message{font-size:12px;margin-top:12px}.span2{grid-column:span 2}@media(max-width:700px){.dash-grid{grid-template-columns:1fr}.span2{grid-column:auto}.dash-head{align-items:flex-start;flex-direction:column}.dash h1{font-size:30px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a><div><a class="text-link" href="/admin.html" id="admin-link" hidden>پنل مدیریت</a> <button id="logout" class="text-link" style="border:0;background:none;font:inherit;cursor:pointer;margin-right:18px">خروج</button></div></header><main class="dash"><div class="eyebrow">فضای شخصی</div><div class="dash-head"><div><h1>سلام، <span id="email">...</span></h1><p class="muted">اینجا می‌توانی سورس بفرستی و وضعیت درخواست‌هایت را ببینی.</p></div></div><div class="dash-grid"><section class="panel"><h2>ارسال سورس جدید</h2><form id="submit-form"><div class="field"><label for="title">عنوان پروژه</label><input id="title" name="title" minlength="3" maxlength="100" required></div><div class="field"><label for="category">دسته‌بندی</label><select id="category" name="category" required><option value="">انتخاب کن</option><option>مدیریت گروه</option><option>ابزار کاربردی</option><option>هوش مصنوعی</option><option>سرگرمی</option><option>فروشگاهی</option><option>سایر</option></select></div><div class="field"><label for="description">توضیحات</label><textarea id="description" name="description" minlength="10" maxlength="2000" required></textarea></div><div class="field"><label for="file">فایل ZIP سورس (حداکثر ۵ مگابایت)</label><input id="file" name="file" type="file" accept=".zip,application/zip" required></div><label class="check"><input type="checkbox" name="rights" required> تأیید می‌کنم حق قانونی انتشار این سورس را دارم و محتوای ارسالی ناقض حقوق دیگران نیست.</label><button class="button" type="submit" style="margin-top:18px">ارسال برای بررسی ←</button><div id="message" role="status"></div></form></section><section class="panel"><h2>درخواست‌های من</h2><div id="submissions" class="muted">در حال بارگذاری…</div></section><section class="panel span2"><h2>اعلان‌ها</h2><div id="notifications" class="muted">در حال بارگذاری…</div></section></div></main><script>
const $=s=>document.querySelector(s);async function api(url,options={}){const r=await fetch(url,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"خطا در دریافت اطلاعات");return d}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function init(){try{const me=await api("/api/me");$("#email").textContent=me.user.email;if(["admin","owner"].includes(me.user.role))$("#admin-link").hidden=false;const [subs,notes]=await Promise.all([api("/api/my/submissions"),api("/api/notifications")]);$("#submissions").innerHTML=subs.items.length?subs.items.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.category)+' · '+new Date(x.created_at).toLocaleDateString("fa-IR")+'</div><div class="status">'+({pending:"در انتظار بررسی",approved:"تأیید و منتشر شد",rejected:"رد شد"}[x.status]||esc(x.status))+'</div>'+(x.review_note?'<div>'+esc(x.review_note)+'</div>':'')+'</div>').join(""):"هنوز درخواستی ثبت نکرده‌ای.";$("#notifications").innerHTML=notes.items.length?notes.items.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><p>'+esc(n.body)+'</p><small class="muted">'+new Date(n.created_at).toLocaleString("fa-IR")+'</small></div>').join(""):"اعلانی نداری."}catch(e){location.href="/login.html"}}
$("#submit-form").onsubmit=async e=>{e.preventDefault();const msg=$("#message"),btn=e.submitter;btn.disabled=true;msg.textContent="در حال ارسال…";try{const fd=new FormData(e.currentTarget);const result=await api("/api/submissions",{method:"POST",body:fd});msg.textContent=result.message;e.currentTarget.reset();await init()}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};
$("#logout").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="/"};init();
</script></body></html>
