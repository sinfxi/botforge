<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | FXI BotForge</title><link rel="stylesheet" href="/styles.css"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>.admin{max-width:1150px;margin:48px auto;padding:0 22px}.admin h1{font-size:34px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.stat,.panel{background:#fffefa;border:1px solid var(--line);border-radius:13px;padding:20px}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:8px}.panel{margin:15px 0}.panel h2{font-size:18px;margin:0 0 15px}.submission{border-top:1px solid var(--line);padding:17px 0}.submission:first-of-type{border:0}.submission h3{font-size:15px;margin:0 0 6px}.submission p{font-size:12px;color:var(--muted);line-height:1.9}.actions{display:flex;gap:9px;margin-top:10px}.actions button{font:inherit;font-size:11px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);cursor:pointer}.approve{background:#e7ecdf;color:#46543a}.reject{background:#f4e8e2;color:#984d3b}.muted{color:var(--muted);font-size:11px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.admin h1{font-size:29px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">F</span><span>FXI <b>BotForge</b></span></a><a class="text-link" href="/dashboard.html">بازگشت به حساب</a></header><main class="admin"><div class="eyebrow">فضای مدیریت</div><h1>مرکز بررسی و انتشار</h1><p class="muted">درخواست‌ها را بررسی کن؛ فقط سورس‌های تأییدشده منتشر می‌شوند.</p><div class="stats"><div class="stat"><span>کاربران</span><strong id="users">—</strong></div><div class="stat"><span>سورس منتشرشده</span><strong id="bots">—</strong></div><div class="stat"><span>در انتظار بررسی</span><strong id="pending">—</strong></div><div class="stat"><span>کل درخواست‌ها</span><strong id="submissions-count">—</strong></div></div><section class="panel"><h2>صف بررسی سورس‌ها</h2><div id="queue" class="muted">در حال بارگذاری…</div></section><section class="panel"><h2>تاریخچه اقدامات</h2><div id="audit" class="muted">در حال بارگذاری…</div></section><div id="message" class="muted"></div></main><script>
const $=s=>document.querySelector(s);async function api(url,options={}){const r=await fetch(url,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"خطا");return d}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){try{const me=await api("/api/me");if(!["admin","owner"].includes(me.user.role))throw new Error("اجازه دسترسی ندارید.");const [stats,subs,audit]=await Promise.all([api("/api/admin/overview"),api("/api/admin/submissions"),api("/api/admin/audit")]);$("#users").textContent=stats.users;$("#bots").textContent=stats.bots;$("#pending").textContent=stats.pending;$("#submissions-count").textContent=stats.submissions;$("#queue").innerHTML=subs.items.length?subs.items.map(s=>'<article class="submission"><h3>'+esc(s.title)+'</h3><div class="muted">'+esc(s.category)+' · '+esc(s.uploader_email)+' · '+(s.file_size/1024).toFixed(1)+' KB</div><p>'+esc(s.description)+'</p><div class="muted">'+esc(s.original_filename)+' · '+new Date(s.created_at).toLocaleString("fa-IR")+'</div>'+(s.status==="pending"?'<div class="actions"><button class="approve" data-id="'+esc(s.id)+'" data-action="approve">تأیید و انتشار</button><button class="reject" data-id="'+esc(s.id)+'" data-action="reject">رد درخواست</button></div>':'<div class="muted">وضعیت: '+esc(s.status)+'</div>')+'</article>').join(""):"درخواستی وجود ندارد.";$("#audit").innerHTML=audit.items.length?audit.items.map(a=>'<div class="submission"><b>'+esc(a.action)+'</b><div class="muted">'+esc(a.actor_email||"سیستم")+' · '+new Date(a.created_at).toLocaleString("fa-IR")+'</div></div>').join(""):"هنوز اقدامی ثبت نشده است."}catch(e){if(e.message.includes("اجازه")){$("#message").textContent=e.message}else location.href="/login.html"}}
$("#queue").addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;let note="";if(b.dataset.action==="reject"){note=prompt("دلیل رد درخواست (اختیاری):")??null;if(note===null)return}b.disabled=true;try{await api("/api/admin/submissions/"+b.dataset.id+"/"+b.dataset.action,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({note})});$("#message").textContent="بررسی ثبت شد.";await load()}catch(err){$("#message").textContent=err.message;b.disabled=false}});load();
</script></body></html>
