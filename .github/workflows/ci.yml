name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Worker and browser JavaScript syntax
        run: |
          node --check src/index.js
          node --check public/app.js
      - name: Validate D1 migration and schema
        run: python tests/check_schema.py
